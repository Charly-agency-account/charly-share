<script>
(async()=>{
const m=document.getElementById('m');
const k=(new URLSearchParams(location.hash.slice(1))).get('k');
if(!k){m.textContent='This page needs the full link it was shared with.';return;}
let html;
try{
const d=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const data=d(document.getElementById('c').textContent.trim());
const key=await crypto.subtle.importKey('raw',d(k),'AES-GCM',false,['decrypt']);
html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d('n2JMLw0hxHdbOXKE')},key,data));
}catch(e){m.textContent='This link is incomplete or has changed. Ask the person who sent it for the full link.';return;}
